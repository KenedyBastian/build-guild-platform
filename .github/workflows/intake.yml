name: Validate guild request
on:
  issues:
    types: [opened, edited, reopened, labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'guild-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.automation preview
        env:
          CONTROL_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
